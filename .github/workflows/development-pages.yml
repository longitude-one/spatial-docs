name: Publish Development Documentation

on:
  pull_request_target:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

concurrency:
  group: development-pages
  cancel-in-progress: false
  queue: max

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: github-pages
    env:
      DOCUSAURUS_DEPLOYMENT: development
      URL_PRODUCTION: https://www.longitude-one.fr
    steps:
      # Use trusted main, never the pull request head (including fork PRs).
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build and verify complete development site
        run: npm run build
        env:
          LEGAL_PUBLISHER_NAME: ${{ vars.LEGAL_PUBLISHER_NAME }}
          LEGAL_PUBLISHER_ADDRESS: ${{ vars.LEGAL_PUBLISHER_ADDRESS }}
          LEGAL_PUBLISHER_PHONE: ${{ vars.LEGAL_PUBLISHER_PHONE }}
          LEGAL_PUBLICATION_DIRECTOR: ${{ vars.LEGAL_PUBLICATION_DIRECTOR }}
          LEGAL_HOST_NAME: ${{ vars.LEGAL_HOST_NAME }}
          LEGAL_HOST_ADDRESS: ${{ vars.LEGAL_HOST_ADDRESS }}
          LEGAL_HOST_PHONE: ${{ vars.LEGAL_HOST_PHONE }}
          LEGAL_ADDITIONAL_STORAGE: ${{ vars.LEGAL_ADDITIONAL_STORAGE }}
          LEGAL_CONFIGURATION_ENVIRONMENT: ${{ vars.LEGAL_CONFIGURATION_ENVIRONMENT }}
          LEGAL_PUBLICATION_APPROVED: ${{ vars.LEGAL_PUBLICATION_APPROVED }}
          LEGAL_TEST_MODE: false
      - name: Verify approved development legal information
        run: node scripts/verify-legal-notice.mjs development public
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v5
