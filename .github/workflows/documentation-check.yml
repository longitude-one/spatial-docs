name: Documentation Check

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions:
  contents: read

jobs:
  documentation-check:
    name: documentation-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate shared assets and source references
        run: npm run validate:assets
      - name: Test resource validation
        run: npm test
      - name: Verify two identical complete publication builds
        run: npm run validate:determinism
      - name: Build and verify development Pages site
        run: npm run build
        env:
          DOCUSAURUS_DEPLOYMENT: development
          URL_PRODUCTION: https://www.longitude-one.fr
      - name: Upload corpus validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: corpus-validation
          path: .publication-validation.json
          include-hidden-files: true
          if-no-files-found: ignore
