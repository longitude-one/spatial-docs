<svg xmlns="http://www.w3.org/2000/svg" width="960" height="794" viewBox="0 0 960 794" role="img" aria-labelledby="timeline-title timeline-description">
<title id="timeline-title">example-library support timeline</title>
<desc id="timeline-description">example-library support timeline. Display window 2024-01-01 through 2029-12-31. Branch 1.x — Released; release: 2024-05-04. Active support until: 2026-12-31; security support until: 2027-12-31. PHP: ^8.3. Notes: Fictional schedule for documentation and tests. Branch 2.x — Planned; planned release: 2027-02-01. Active support until: 2028-12-31; security support until: 2029-12-31. PHP: ^8.4. Branch 3.x — Planned; planned release: unannounced. Active support until: unannounced; security support until: unannounced. PHP: unannounced. Notes: No release schedule announced. Planned releases use diamonds, actual releases circles, active support a solid bar, and security fixes only a hatched bar. Arrows mark clipped support periods.</desc>
