<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 340" role="img" aria-labelledby="title description">
  <title id="title">MultiPoint examples</title>
  <desc id="description">One MultiPoint containing four separate points, with no connecting lines.</desc>
  <rect width="740" height="340" fill="#F5F8FA" />
  <g font-family="sans-serif">
    <text x="45" y="52" font-size="20" fill="#183D55">Four points in one MultiPoint</text>
    <circle cx="105" cy="210" r="5" fill="#2784C2" stroke="#183D55" stroke-width="1.5" />
    <circle cx="255" cy="105" r="5" fill="#2784C2" stroke="#183D55" stroke-width="1.5" />
    <circle cx="415" cy="225" r="5" fill="#2784C2" stroke="#183D55" stroke-width="1.5" />
    <circle cx="610" cy="135" r="5" fill="#2784C2" stroke="#183D55" stroke-width="1.5" />
    <text x="45" y="290" font-size="18" fill="#183D55">The points belong to one collection.</text>
  </g>
  <g font-family="sans-serif" font-size="18" fill="#183D55">
    <text x="115" y="200">A</text>
    <text x="265" y="95">B</text>
    <text x="425" y="215">C</text>
    <text x="620" y="125">D</text>
  </g>
</svg>
