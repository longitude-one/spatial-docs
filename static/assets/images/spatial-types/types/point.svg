<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 340" role="img" aria-labelledby="title description">
  <title id="title">Point examples</title>
  <desc id="description">Two separate Point examples; each dot represents one location.</desc>
  <rect width="740" height="340" fill="#F5F8FA" />
  <g font-family="sans-serif">
    <text x="45" y="52" font-size="20" fill="#183D55">One location</text>
    <circle cx="160" cy="155" r="5" fill="#2784C2" stroke="#183D55" stroke-width="1.5" />
    <text x="415" y="52" font-size="20" fill="#183D55">Another location</text>
    <circle cx="540" cy="205" r="5" fill="#2784C2" stroke="#183D55" stroke-width="1.5" />
    <text x="45" y="290" font-size="18" fill="#183D55">Each example is a separate Point.</text>
  </g>
  <g font-family="sans-serif" font-size="18" fill="#183D55">
    <text x="170" y="145">A</text>
    <text x="550" y="195">B</text>
  </g>
</svg>
