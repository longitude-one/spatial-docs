<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 340" role="img" aria-labelledby="title description">
  <title id="title">Polygon examples</title>
  <desc id="description">A polygon without holes and a polygon with one rectangular hole. The hole is excluded from the filled area.</desc>
  <rect width="740" height="340" fill="#F5F8FA" />
  <g font-family="sans-serif">
    <text x="45" y="52" font-size="20" fill="#183D55">Without holes</text>
    <polygon points="65,230 285,230 250,100 105,115" fill="#39A576" fill-opacity="0.22" stroke="#2784C2" stroke-width="3" stroke-linejoin="round" />
    <text x="415" y="52" font-size="20" fill="#183D55">With one hole</text>
    <path d="M430 100 H685 V240 H430 Z M500 145 H615 V200 H500 Z" fill="#39A576" fill-opacity="0.22" fill-rule="evenodd" stroke="#2784C2" stroke-width="3" />
    <text x="530" y="180" font-size="18" fill="#183D55">Hole</text>
    <text x="45" y="290" font-size="18" fill="#183D55">Shaded regions belong to the Polygon.</text>
  </g>
  <g>
    <circle cx="65" cy="230" r="5" fill="#2784C2" stroke="#183D55" stroke-width="1.5" />
    <circle cx="285" cy="230" r="5" fill="#2784C2" stroke="#183D55" stroke-width="1.5" />
    <circle cx="250" cy="100" r="5" fill="#2784C2" stroke="#183D55" stroke-width="1.5" />
    <circle cx="105" cy="115" r="5" fill="#2784C2" stroke="#183D55" stroke-width="1.5" />
    <circle cx="430" cy="100" r="5" fill="#2784C2" stroke="#183D55" stroke-width="1.5" />
    <circle cx="685" cy="100" r="5" fill="#2784C2" stroke="#183D55" stroke-width="1.5" />
    <circle cx="685" cy="240" r="5" fill="#2784C2" stroke="#183D55" stroke-width="1.5" />
    <circle cx="430" cy="240" r="5" fill="#2784C2" stroke="#183D55" stroke-width="1.5" />
    <circle cx="500" cy="145" r="5" fill="#2784C2" stroke="#183D55" stroke-width="1.5" />
    <circle cx="615" cy="145" r="5" fill="#2784C2" stroke="#183D55" stroke-width="1.5" />
    <circle cx="615" cy="200" r="5" fill="#2784C2" stroke="#183D55" stroke-width="1.5" />
    <circle cx="500" cy="200" r="5" fill="#2784C2" stroke="#183D55" stroke-width="1.5" />
  </g>
  <g font-family="sans-serif" font-size="18" fill="#183D55">
    <text x="45" y="240">A</text>
    <text x="295" y="240">B</text>
    <text x="255" y="88">C</text>
    <text x="85" y="105">D</text>
    <text x="410" y="90">E</text>
    <text x="693" y="90">F</text>
    <text x="695" y="250">G</text>
    <text x="410" y="250">H</text>
    <text x="480" y="137">I</text>
    <text x="623" y="137">J</text>
    <text x="623" y="220">K</text>
    <text x="480" y="220">L</text>
  </g>
</svg>
