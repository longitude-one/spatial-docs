<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="title description">
<title id="title">Intermediate Point equals an endpoint</title>
<desc id="description">A and intermediate Point B coincide at (-1, 0). C is at (1, 0). No valid defining triple is supplied.</desc>
<rect width="640" height="280" fill="#F5F8FA"/>
<!-- Uniform scale: svgX = 140 + 90*x; svgY = 180 - 90*y. -->
<circle cx="50" cy="180" r="14" fill="none" stroke="#B33131" stroke-width="2"/>
<circle cx="50" cy="180" r="7" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="50" y="212" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">A = B</text>
<circle cx="230" cy="180" r="7" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="230" y="212" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">C</text>
<text x="290" y="95" font-family="sans-serif" font-size="18" fill="#183D55">A = B at (-1, 0)</text>
<text x="290" y="135" font-family="sans-serif" font-size="18" fill="#183D55">B must differ from A and C</text>
<text x="290" y="175" font-family="sans-serif" font-size="18" fill="#B33131">Invalid arc definition</text>
</svg>
