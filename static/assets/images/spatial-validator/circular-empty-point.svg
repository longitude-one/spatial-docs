<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="title description">
<title id="title">EMPTY intermediate Point</title>
<desc id="description">A and C have coordinates, but the intermediate Point is EMPTY. The dashed curve is only a schematic missing arc.</desc>
<rect width="640" height="280" fill="#F5F8FA"/>
<!-- Uniform scale: svgX = 140 + 90*x; svgY = 180 - 90*y. -->
<path d="M 50,180 A 90,90 0 0 1 230,180" fill="none" stroke="#B33131" stroke-width="3" stroke-dasharray="7 6"/>
<text x="140" y="65" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#B33131">EMPTY</text>
<circle cx="50" cy="180" r="7" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="50" y="212" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">A</text>
<circle cx="230" cy="180" r="7" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="230" y="212" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">C</text>
<text x="290" y="95" font-family="sans-serif" font-size="18" fill="#183D55">points[1] is EMPTY</text>
<text x="290" y="135" font-family="sans-serif" font-size="18" fill="#183D55">No intermediate position</text>
<text x="290" y="175" font-family="sans-serif" font-size="18" fill="#B33131">Invalid arc definition</text>
<text x="25" y="255" font-family="sans-serif" font-size="16" fill="#183D55">Dashed curve: illustration only, not a defined arc</text>
</svg>
