<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="title description">
  <title id="title">Validity, simplicity and closure of circular curves</title>
  <desc id="description">Coordinates A (-1,0), B (0,1), C (1,0), D (0,-1). A-B-C is an open simple semicircle. A-B-C-B-A retraces it and is closed but non-simple. A-B-C-D-A is a simple closed circle.</desc>
  <rect width="900" height="320" fill="#F5F8FA"/>
  <g fill="#183D55" font-family="sans-serif" font-size="18" text-anchor="middle">
    <text x="150" y="30">Open semicircle</text><text x="450" y="30">Retraced semicircle</text><text x="750" y="30">Closed circle</text>
    <text x="150" y="266">A → B → C</text><text x="450" y="266">A → B → C → B → A</text><text x="750" y="266">A → B → C → D → A</text>
    <text x="150" y="296">Valid · Simple · Open</text><text x="450" y="296">Valid · Non-simple · Closed</text><text x="750" y="296">Valid · Simple · Closed</text>
  </g>
  <g fill="none" stroke="#183D55" stroke-width="1">
    <path d="M40 150 H260 M150 55 V235 M340 150 H560 M450 55 V235 M640 150 H860 M750 55 V235"/>
  </g>
  <g fill="#183D55" font-family="sans-serif" font-size="14">
    <text x="250" y="168">X</text><text x="158" y="63">Y</text><text x="550" y="168">X</text><text x="458" y="63">Y</text><text x="850" y="168">X</text><text x="758" y="63">Y</text>
  </g>
  <g fill="none" stroke-width="4">
    <path d="M70 150 A80 80 0 0 1 230 150" stroke="#2784C2"/>
    <path d="M370 150 A80 80 0 0 1 530 150" stroke="#2784C2"/>
    <path d="M530 150 A80 80 0 0 0 370 150" stroke="#183D55" stroke-dasharray="8 8"/>
    <circle cx="750" cy="150" r="80" stroke="#2784C2"/>
  </g>
  <g fill="#2784C2" stroke="#183D55" stroke-width="2">
    <circle cx="70" cy="150" r="5"/><circle cx="150" cy="70" r="5"/><circle cx="230" cy="150" r="5"/>
    <circle cx="370" cy="150" r="5"/><circle cx="450" cy="70" r="5"/><circle cx="530" cy="150" r="5"/>
    <circle cx="670" cy="150" r="5"/><circle cx="750" cy="70" r="5"/><circle cx="830" cy="150" r="5"/><circle cx="750" cy="230" r="5"/>
  </g>
  <g fill="#183D55" font-family="sans-serif" font-size="16" text-anchor="middle">
    <text x="65" y="180">A (-1,0)</text><text x="145" y="52">B (0,1)</text><text x="235" y="180">C (1,0)</text>
    <text x="365" y="180">A</text><text x="440" y="52">B</text><text x="535" y="180">C</text>
    <text x="665" y="180">A</text><text x="740" y="52">B</text><text x="835" y="180">C</text><text x="790" y="235">D (0,-1)</text>
    <text x="450" y="220">Dashed return retraces the same arc</text>
  </g>
</svg>
