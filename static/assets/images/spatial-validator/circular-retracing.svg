<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="title description">
<title id="title">Retraced semicircle</title>
<desc id="description">A (-1, 0), B (0, 1), C (1, 0), B, A describe the same upper semicircle twice in opposite directions. The overlapping second arc fails simplicity.</desc>
<rect width="640" height="280" fill="#F5F8FA"/>
<!-- Uniform scale: svgX = 140 + 90*x; svgY = 180 - 90*y. -->
<path d="M 50,180 A 90,90 0 0 1 230,180" fill="none" stroke="#2784C2" stroke-width="6"/>
<path d="M 230,180 A 90,90 0 0 0 50,180" fill="none" stroke="#B33131" stroke-width="3" stroke-dasharray="7 5"/>
<text x="93" y="135" font-family="sans-serif" font-size="25" fill="#183D55">→</text><text x="165" y="135" font-family="sans-serif" font-size="25" fill="#B33131">←</text>
<circle cx="50" cy="180" r="7" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="50" y="212" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">A</text>
<circle cx="230" cy="180" r="7" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="230" y="212" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">C</text>
<circle cx="140" cy="90" r="7" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="140" y="70" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">B</text>
<text x="290" y="95" font-family="sans-serif" font-size="18" fill="#183D55">arc 0: A → B → C</text>
<text x="290" y="135" font-family="sans-serif" font-size="18" fill="#183D55">arc 1: C → B → A</text>
<text x="290" y="175" font-family="sans-serif" font-size="18" fill="#B33131">Overlap: not simple</text>
</svg>
