<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title description">
<title id="title">A valid CircularString</title><desc id="description">A (-1,0), B (0,1), C (1,0) define the simple upper semicircle of radius one, centered at (0,0).</desc>
<rect width="760" height="330" fill="#F5F8FA"/>
<!-- Uniform scale: svgX = 160 + 90*x; svgY = 220 - 90*y. -->
<path d="M 70,220 A 90,90 0 0 1 250,220" fill="none" stroke="#2784C2" stroke-width="4" stroke-linejoin="round"/>
<circle cx="70" cy="220" r="6" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="70" y="247" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">A</text>
<circle cx="160" cy="130" r="6" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="160" y="110" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">B</text>
<circle cx="250" cy="220" r="6" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="250" y="247" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">C</text>
<text x="355" y="100" font-family="sans-serif" font-size="18" fill="#183D55">Three valid defining Points</text>
<text x="355" y="140" font-family="sans-serif" font-size="18" fill="#183D55">B differs from both endpoints</text>
<text x="355" y="180" font-family="sans-serif" font-size="18" fill="#183D55">Valid and simple open arc</text>
</svg>
