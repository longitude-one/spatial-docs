<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title description">
<title id="title">Crossing MultiLineString members</title><desc id="description">The first segment connects (0,0) to (2,2); the second connects (0,2) to (2,0). They cross at (1,1), inside both segments. Explicit simplicity fails.</desc>
<rect width="760" height="300" fill="#F5F8FA"/>
<!-- Uniform scale: svgX = 60 + 80*x; svgY = 220 - 80*y. -->
<path d="M 60,220 L 220,60 M 60,60 L 220,220" stroke="#2784C2" stroke-width="4" fill="none"/>
<circle cx="140" cy="140" r="12" fill="#F5F8FA" stroke="#B33131" stroke-width="2"/>
<path d="M 135,135 L 145,145 M 135,145 L 145,135" stroke="#B33131" stroke-width="2"/>
<circle cx="60" cy="220" r="6" fill="#2784C2" stroke="#183D55" stroke-width="2"/>
<text x="60" y="252" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">A</text>
<circle cx="220" cy="60" r="6" fill="#2784C2" stroke="#183D55" stroke-width="2"/>
<text x="220" y="92" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">B</text>
<circle cx="60" cy="60" r="6" fill="#2784C2" stroke="#183D55" stroke-width="2"/>
<text x="60" y="92" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">C</text>
<circle cx="220" cy="220" r="6" fill="#2784C2" stroke="#183D55" stroke-width="2"/>
<text x="220" y="252" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">D</text>
<text x="360" y="85" font-family="sans-serif" font-size="18" fill="#183D55">Two individually simple lines</text>
<text x="360" y="125" font-family="sans-serif" font-size="18" fill="#183D55">Ordinary validity: passes</text>
<text x="360" y="165" font-family="sans-serif" font-size="18" fill="#B33131">SimpleMultiLineString: fails</text>
</svg>
