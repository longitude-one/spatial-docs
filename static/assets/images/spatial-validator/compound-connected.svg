<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title description">
<title id="title">Connected arc and segment</title><desc id="description">An upper semicircle from A through B to C joins a segment from C to D. The components share C and form a valid simple curve.</desc>
<rect width="720" height="280" fill="#F5F8FA"/>
<!-- Uniform scale: svgX = 120 + 70*x; svgY = 180 - 70*y. -->
<path d="M 50,180 A 70,70 0 0 1 190,180 L 260,180" fill="none" stroke="#2784C2" stroke-width="4"/>
<circle cx="50" cy="180" r="6" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="50" y="210" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">A</text>
<circle cx="120" cy="110" r="6" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="120" y="90" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">B</text>
<circle cx="190" cy="180" r="6" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="190" y="210" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">C</text>
<circle cx="260" cy="180" r="6" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="260" y="210" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">D</text>
<text x="330" y="85" font-family="sans-serif" font-size="18" fill="#183D55">curves[0]: circular arc</text>
<text x="330" y="125" font-family="sans-serif" font-size="18" fill="#183D55">curves[1]: straight segment</text>
<text x="330" y="165" font-family="sans-serif" font-size="18" fill="#183D55">Shared endpoint C: valid</text>
</svg>
