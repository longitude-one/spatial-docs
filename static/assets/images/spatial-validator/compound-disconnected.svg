<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title description">
<title id="title">Disconnected components</title><desc id="description">The arc ends at C (1, 0), but the segment starts at D (2, 0). A red dashed gap is absent from the actual curve.</desc>
<rect width="720" height="280" fill="#F5F8FA"/>
<!-- Uniform scale: svgX = 100 + 60*x; svgY = 180 - 60*y. -->
<path d="M 40,180 A 60,60 0 0 1 160,180 M 220,180 H 280" fill="none" stroke="#2784C2" stroke-width="4"/>
<path d="M 160,180 H 220" stroke="#B33131" stroke-width="3" stroke-dasharray="6 5"/>
<circle cx="40" cy="180" r="6" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="40" y="210" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">A</text>
<circle cx="100" cy="120" r="6" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="100" y="100" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">B</text>
<circle cx="160" cy="180" r="6" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="160" y="210" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">C</text>
<circle cx="220" cy="180" r="6" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="220" y="210" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">D</text>
<circle cx="280" cy="180" r="6" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="280" y="210" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">E</text>
<text x="330" y="85" font-family="sans-serif" font-size="18" fill="#183D55">Arc ends at C (1, 0)</text>
<text x="330" y="125" font-family="sans-serif" font-size="18" fill="#183D55">Segment starts at D (2, 0)</text>
<text x="330" y="165" font-family="sans-serif" font-size="18" fill="#B33131">Gap: continuity fails</text>
</svg>
