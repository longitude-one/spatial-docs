<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title description">
<title id="title">Arc and segment intersection</title><desc id="description">The segment from C (1, 0) to D (-1, 1) shares C with the upper semicircle and also crosses it at (-0.6, 0.8). Simplicity fails at that extra crossing.</desc>
<rect width="720" height="280" fill="#F5F8FA"/>
<!-- Uniform scale: svgX = 150 + 90*x; svgY = 180 - 90*y. -->
<path d="M 60,180 A 90,90 0 0 1 240,180 L 60,90" fill="none" stroke="#2784C2" stroke-width="4"/>
<circle cx="96" cy="108" r="12" fill="#F5F8FA" stroke="#B33131" stroke-width="2"/>
<path d="M 91,103 L 101,113 M 91,113 L 101,103" stroke="#B33131" stroke-width="2"/>
<circle cx="60" cy="180" r="6" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="60" y="210" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">A</text>
<circle cx="150" cy="90" r="6" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="150" y="70" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">B</text>
<circle cx="240" cy="180" r="6" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="240" y="210" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">C</text>
<circle cx="60" cy="90" r="6" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="60" y="70" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">D</text>
<text x="330" y="85" font-family="sans-serif" font-size="18" fill="#183D55">Shared endpoint C: allowed</text>
<text x="330" y="125" font-family="sans-serif" font-size="18" fill="#183D55">Extra crossing: (-0.6, 0.8)</text>
<text x="330" y="165" font-family="sans-serif" font-size="18" fill="#B33131">Not simple</text>
</svg>
