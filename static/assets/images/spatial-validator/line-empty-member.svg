<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-labelledby="title description">
  <title id="title">No EMPTY Point members</title>
  <desc id="description">An EMPTY Point has no spatial position and cannot be a line member. The dashed gap is schematic.</desc>
  <rect width="640" height="250" fill="#F5F8FA"/>
  <text x="25" y="40" font-family="sans-serif" fill="#183D55" font-size="20" font-weight="bold">No EMPTY Point members</text>
  <g transform="translate(0 -250)">
<path d="M 60,385 H 220" stroke="#B33131" stroke-width="3" stroke-dasharray="7 6"/>
  <g fill="#2784C2" stroke="#183D55" stroke-width="2">
    <circle cx="60" cy="385" r="7"/><circle cx="220" cy="385" r="7"/>
  </g>
  <g font-family="sans-serif" fill="#183D55" font-size="18">
    <text x="25" y="425">A (0, 0)</text><text x="185" y="425">B (2, 0)</text>
    <text x="103" y="355" fill="#B33131">EMPTY</text>
    <text x="280" y="365">No position for points[1]</text>
    <text x="280" y="400" fill="#B33131">Invalid line: missing member position</text>
  </g>
  </g>
</svg>
