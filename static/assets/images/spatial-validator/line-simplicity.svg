<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-labelledby="title description">
  <title id="title">Optional simplicity check</title>
  <desc id="description">The line A to B to C to D crosses itself. It passes ordinary validity but fails explicit simplicity.</desc>
  <rect width="640" height="250" fill="#F5F8FA"/>
  <text x="25" y="40" font-family="sans-serif" fill="#183D55" font-size="20" font-weight="bold">Optional simplicity check</text>
  <g transform="translate(0 -750)">
<path d="M 60,970 L 220,850 L 60,850 L 220,970" fill="none" stroke="#2784C2" stroke-width="4"/>
  <g fill="#2784C2" stroke="#183D55" stroke-width="2">
    <circle cx="60" cy="970" r="6"/><circle cx="220" cy="850" r="6"/>
    <circle cx="60" cy="850" r="6"/><circle cx="220" cy="970" r="6"/>
  </g>
  <circle cx="140" cy="910" r="12" fill="#F5F8FA" stroke="#B33131" stroke-width="2"/>
  <path d="M 135,905 L 145,915 M 135,915 L 145,905" stroke="#B33131" stroke-width="2"/>
  <g font-family="sans-serif" fill="#183D55" font-size="18">
    <text x="35" y="978">A</text><text x="230" y="856">B</text>
    <text x="35" y="856">C</text><text x="230" y="978">D</text>
    <text x="280" y="855">Sequence: A → B → C → D</text>
    <text x="280" y="890">Valid ordinary LineString</text>
    <text x="280" y="925" fill="#B33131">Not simple: crossing segments</text>
    <text x="280" y="960">Schematic view</text>
  </g>
  </g>
</svg>
