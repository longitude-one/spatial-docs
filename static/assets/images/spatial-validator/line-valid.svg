<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title description">
<title id="title">A valid open LineString</title><desc id="description">A (0,0), B (2,1), C (4,0) form a simple open line with distinct consecutive positions.</desc>
<rect width="760" height="330" fill="#F5F8FA"/>
<!-- Uniform scale: svgX = 60 + 60*x; svgY = 240 - 60*y. -->
<path d="M 60,240 L 180,180 L 300,240" fill="none" stroke="#2784C2" stroke-width="4" stroke-linejoin="round"/>
<circle cx="60" cy="240" r="6" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="60" y="267" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">A</text>
<circle cx="180" cy="180" r="6" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="180" y="160" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">B</text>
<circle cx="300" cy="240" r="6" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="300" y="267" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">C</text>
<text x="355" y="100" font-family="sans-serif" font-size="18" fill="#183D55">A → B → C</text>
<text x="355" y="140" font-family="sans-serif" font-size="18" fill="#183D55">Valid non-empty Points</text>
<text x="355" y="180" font-family="sans-serif" font-size="18" fill="#183D55">Valid and simple open line</text>
</svg>
