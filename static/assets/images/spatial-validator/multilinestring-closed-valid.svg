<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title description">
<title id="title">A valid closed MultiLineString</title><desc id="description">Two disjoint triangular LineStrings each return to their starting point. Each is closed and simple, and the collection passes explicit closure and simplicity.</desc>
<rect width="760" height="330" fill="#F5F8FA"/>
<!-- Uniform scale: svgX = 50 + 50*x; svgY = 255 - 50*y. -->
<path d="M 50,255 L 150,255 L 50,155 Z M 200,255 L 300,255 L 200,155 Z" fill="none" stroke="#2784C2" stroke-width="4" stroke-linejoin="round"/>
<circle cx="50" cy="255" r="6" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="50" y="282" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">A</text>
<circle cx="150" cy="255" r="6" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="150" y="282" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">B</text>
<circle cx="50" cy="155" r="6" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="50" y="135" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">C</text>
<circle cx="200" cy="255" r="6" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="200" y="282" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">D</text>
<circle cx="300" cy="255" r="6" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="300" y="282" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">E</text>
<circle cx="200" cy="155" r="6" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="200" y="135" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">F</text>
<text x="355" y="100" font-family="sans-serif" font-size="18" fill="#183D55">Line 0: A → B → C → A</text>
<text x="355" y="140" font-family="sans-serif" font-size="18" fill="#183D55">Line 1: D → E → F → D</text>
<text x="355" y="180" font-family="sans-serif" font-size="18" fill="#183D55">Both members closed and simple</text>
</svg>
