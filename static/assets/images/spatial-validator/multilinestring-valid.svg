<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title description">
<title id="title">A valid MultiLineString</title><desc id="description">Line 0 joins (0,0) to (2,1). Line 1 joins (0,2) to (2,3). The two simple lines are disjoint.</desc>
<rect width="760" height="330" fill="#F5F8FA"/>
<!-- Uniform scale: svgX = 70 + 65*x; svgY = 270 - 65*y. -->
<path d="M 70,270 L 200,205 M 70,140 L 200,75" fill="none" stroke="#2784C2" stroke-width="4" stroke-linejoin="round"/>
<circle cx="70" cy="270" r="6" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="70" y="297" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">A</text>
<circle cx="200" cy="205" r="6" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="200" y="232" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">B</text>
<circle cx="70" cy="140" r="6" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="70" y="167" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">C</text>
<circle cx="200" cy="75" r="6" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="200" y="55" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">D</text>
<text x="355" y="100" font-family="sans-serif" font-size="18" fill="#183D55">Line 0: A → B</text>
<text x="355" y="140" font-family="sans-serif" font-size="18" fill="#183D55">Line 1: C → D</text>
<text x="355" y="180" font-family="sans-serif" font-size="18" fill="#183D55">Valid and simple collection</text>
</svg>
