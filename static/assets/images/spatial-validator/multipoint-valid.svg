<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title description">
<title id="title">A valid MultiPoint</title><desc id="description">Two independent distinct Points at (0,0) and (2,0) form a valid and simple MultiPoint. They are not connected by a segment.</desc>
<rect width="760" height="330" fill="#F5F8FA"/>
<!-- Uniform scale: svgX = 80 + 80*x; svgY = 200 - 80*y. -->
<circle cx="80" cy="200" r="6" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="80" y="227" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">A (0, 0)</text>
<circle cx="240" cy="200" r="6" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="240" y="227" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">B (2, 0)</text>
<text x="355" y="100" font-family="sans-serif" font-size="18" fill="#183D55">Two independent valid Points</text>
<text x="355" y="140" font-family="sans-serif" font-size="18" fill="#183D55">Matching collection metadata</text>
<text x="355" y="180" font-family="sans-serif" font-size="18" fill="#183D55">Distinct positions: simple</text>
</svg>
