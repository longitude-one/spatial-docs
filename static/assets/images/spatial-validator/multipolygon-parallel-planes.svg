<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img" aria-labelledby="title description">
<title id="title">Parallel surfaces at different heights</title><desc id="description">Two square Polygon members occupy Z = 0 and Z = 1. Their XY footprints coincide, but their surfaces are disjoint in XYZ.</desc>
<rect width="820" height="360" fill="#F5F8FA"/>
<!-- Oblique projection: svgX = 140 + 55*x - 35*y; svgY = 190 + 25*y - 60*z. -->
<path d="M 140,190 L 250,190 L 180,240 L 70,240 L 140,190 Z" fill="#39A576" fill-opacity="0.2" stroke="#2784C2" stroke-width="3"/>
<path d="M 140,130 L 250,130 L 180,180 L 70,180 L 140,130 Z" fill="#2784C2" fill-opacity="0.2" stroke="#2784C2" stroke-width="3"/>
<text x="265" y="245" font-family="sans-serif" font-size="18" fill="#183D55">Z = 0</text>
<text x="265" y="145" font-family="sans-serif" font-size="18" fill="#183D55">Z = 1</text>
<text x="440" y="100" font-family="sans-serif" font-size="18" fill="#183D55">Same XY footprint</text>
<text x="440" y="140" font-family="sans-serif" font-size="18" fill="#183D55">Different heights</text>
<text x="440" y="180" font-family="sans-serif" font-size="18" fill="#183D55">Valid XYZ MultiPolygon</text>
<text x="440" y="290" font-family="sans-serif" font-size="16" fill="#183D55">Oblique XYZ projection</text>
</svg>
