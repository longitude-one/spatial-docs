<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img" aria-labelledby="title description">
<title id="title">A shared boundary interval</title><desc id="description">A shared boundary interval. Member boundaries: [[(0, 0), (2, 0), (2, 2), (0, 2), (0, 0)], [(2, 0), (4, 0), (4, 2), (2, 2), (2, 0)]]. Interiors do not overlap. Shared edge: (2, 0) to (2, 2). MultiPolygon intersection error.</desc>
<rect width="820" height="360" fill="#F5F8FA"/>
<!-- Uniform scale: svgX = 70 + 55*x; svgY = 285 - 55*y. -->
<path d="M 70,285 L 180,285 L 180,175 L 70,175 L 70,285 Z" fill="#39A576" fill-opacity="0.2" stroke="#2784C2" stroke-width="3"/>
<path d="M 180,285 L 290,285 L 290,175 L 180,175 L 180,285 Z" fill="#39A576" fill-opacity="0.2" stroke="#183D55" stroke-width="3"/>
<path d="M 180,285 V 175" stroke="#B33131" stroke-width="6"/>
<text x="440" y="100" font-family="sans-serif" font-size="18" fill="#183D55">Interiors do not overlap</text>
<text x="440" y="140" font-family="sans-serif" font-size="18" fill="#183D55">Shared edge: (2, 0) to (2, 2)</text>
<text x="440" y="180" font-family="sans-serif" font-size="18" fill="#B33131">MultiPolygon intersection error</text>
</svg>
