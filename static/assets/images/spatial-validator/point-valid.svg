<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title description">
<title id="title">A valid Point</title><desc id="description">P has X = 10 and Y = 20. Both ordinates are finite. The same values are within longitude and latitude bounds for a Geography Point.</desc>
<rect width="760" height="330" fill="#F5F8FA"/>
<!-- Uniform scale: svgX = 60 + 8*x; svgY = 240 - 8*y. -->
<path d="M 60,40 V 240 H 280" fill="none" stroke="#183D55" stroke-width="1.5"/>
<path d="M 60,80 H 140 V 240" fill="none" stroke="#183D55" stroke-width="1" stroke-dasharray="5 5"/>
<circle cx="140" cy="80" r="6" fill="#2784C2" stroke="#183D55" stroke-width="2"/>
<g font-family="sans-serif" font-size="18" fill="#183D55"><text x="158" y="70">P (10, 20)</text><text x="130" y="266">10</text><text x="25" y="86">20</text><text x="280" y="265">X</text><text x="35" y="40">Y</text><text x="36" y="265">0</text></g>
<text x="355" y="100" font-family="sans-serif" font-size="18" fill="#183D55">All declared coordinates present</text>
<text x="355" y="140" font-family="sans-serif" font-size="18" fill="#183D55">All coordinates finite</text>
<text x="355" y="180" font-family="sans-serif" font-size="18" fill="#183D55">Also within Geography bounds</text>
</svg>
