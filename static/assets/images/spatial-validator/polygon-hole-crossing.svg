<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" role="img" aria-labelledby="title description">
<title id="title">Crossing boundaries</title><desc id="description">Crossing boundaries. Hole crosses the right edge. Contacts: (12, 4), (12, 8). Boundary intersection fails. Exterior square: (0,0), (12,0), (12,12), (0,12). Hole coordinates: [[(10, 4), (14, 4), (14, 8), (10, 8), (10, 4)]].</desc>
