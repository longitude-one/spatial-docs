<path d="M 210,196 L 274,196 L 274,132 L 210,132 L 210,196 Z" fill="#F5F8FA" stroke="#B33131" stroke-width="2.5"/>
<path d="M 210,196 L 274,196 L 274,132 L 210,132 L 210,196 Z" fill="#D45151" fill-opacity="0.15" stroke="none"/>
