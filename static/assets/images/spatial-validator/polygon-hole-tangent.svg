<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" role="img" aria-labelledby="title description">
<title id="title">Valid isolated tangent contact</title><desc id="description">Valid isolated tangent contact. One contact at (0, 6). No shared boundary interval. Connected interior: valid. Exterior square: (0,0), (12,0), (12,12), (0,12). Hole coordinates: [[(0, 6), (3, 4), (3, 8), (0, 6)]].</desc>
<rect width="820" height="340" fill="#F5F8FA"/>
<!-- Uniform scale: svgX = 50 + 16*x; svgY = 260 - 16*y. -->
<path d="M 50,260 L 242,260 L 242,68 L 50,68 L 50,260 Z" fill="#39A576" fill-opacity="0.22" stroke="#2784C2" stroke-width="3"/>
<path d="M 50,164 L 98,196 L 98,132 L 50,164 Z" fill="#F5F8FA" stroke="#2784C2" stroke-width="2.5"/>
<circle cx="50" cy="164" r="6" fill="#DB9251" stroke="#183D55" stroke-width="1.5"/>
<text x="50" y="45" font-family="sans-serif" font-size="18" fill="#183D55">Exterior: rings[0]</text>
<text x="50" y="305" font-family="sans-serif" font-size="16" fill="#183D55">Green: parcel interior · Pale: excluded area</text>
<text x="450" y="100" font-family="sans-serif" font-size="18" fill="#183D55">One contact at (0, 6)</text>
<text x="450" y="142" font-family="sans-serif" font-size="18" fill="#183D55">No shared boundary interval</text>
<text x="450" y="184" font-family="sans-serif" font-size="18" fill="#183D55">Connected interior: valid</text>
