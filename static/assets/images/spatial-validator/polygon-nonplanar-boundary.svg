<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" role="img" aria-labelledby="title description">
<title id="title">A vertex outside the supporting plane</title><desc id="description">A (0,0,0), B (2,0,0) and C (2,2,0) establish Z = 0. D (0,2,1) lies above it. The dashed guide projects D onto the reference plane.</desc>
<rect width="760" height="310" fill="#F5F8FA"/>
<!-- Oblique projection: svgX = 90 + 70*x + 40*y; svgY = 230 - 25*y - 60*z. -->
<path d="M 90,230 L 230,230 L 310,180 L 170,180 Z" fill="#39A576" fill-opacity="0.15" stroke="#183D55" stroke-width="1.5" stroke-dasharray="6 5"/>
<path d="M 90,230 L 230,230 L 310,180" fill="none" stroke="#2784C2" stroke-width="3"/>
<path d="M 310,180 L 170,120 L 90,230" fill="none" stroke="#B33131" stroke-width="3"/>
<path d="M 170,120 V 180" stroke="#B33131" stroke-width="2" stroke-dasharray="5 4"/>
<text x="225" y="275" font-family="sans-serif" font-size="18" fill="#183D55">Z = 0</text>
<circle cx="90" cy="230" r="6" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="90" y="258" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">A</text>
<circle cx="230" cy="230" r="6" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="230" y="258" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">B</text>
<circle cx="310" cy="180" r="6" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="310" y="165" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">C</text>
<circle cx="170" cy="120" r="6" fill="#B33131" stroke="#183D55" stroke-width="2"/><text x="170" y="105" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">D</text>
<text x="370" y="95" font-family="sans-serif" font-size="18" fill="#183D55">A, B, C: Z = 0</text>
<text x="370" y="135" font-family="sans-serif" font-size="18" fill="#183D55">D (0, 2, 1): outside the plane</text>
<text x="370" y="175" font-family="sans-serif" font-size="18" fill="#B33131">Invalid planar surface</text>
<text x="370" y="245" font-family="sans-serif" font-size="16" fill="#183D55">Oblique XYZ projection</text>
</svg>
