<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img" aria-labelledby="title description">
<title id="title">An EMPTY contributing patch</title><desc id="description">An EMPTY contributing patch. A (0,0,0), B (2,0,0), C (0,2,0), D (0,0,2). patches[0]: valid triangle. patches[1]: EMPTY. EMPTY patch forbidden. The EMPTY box is schematic and has no spatial position.</desc>
<rect width="820" height="360" fill="#F5F8FA"/>
<!-- Oblique projection: svgX = 140 + 55*x - 35*y; svgY = 190 + 25*y - 60*z. -->
<path d="M 140,190 L 70,240 L 250,190 L 140,190 Z" fill="#39A576" fill-opacity="0.2" stroke="#2784C2" stroke-width="3"/>
<rect x="45" y="275" width="320" height="45" fill="none" stroke="#B33131" stroke-width="2" stroke-dasharray="6 5"/>
<text x="65" y="304" font-family="sans-serif" font-size="18" fill="#B33131">patches[1]: EMPTY (no position)</text>
<circle cx="140" cy="190" r="5" fill="#2784C2" stroke="#183D55" stroke-width="1.5"/><text x="128" y="213" font-family="sans-serif" font-size="18" fill="#183D55">A</text>
<circle cx="250" cy="190" r="5" fill="#2784C2" stroke="#183D55" stroke-width="1.5"/><text x="238" y="213" font-family="sans-serif" font-size="18" fill="#183D55">B</text>
<circle cx="70" cy="240" r="5" fill="#2784C2" stroke="#183D55" stroke-width="1.5"/><text x="58" y="263" font-family="sans-serif" font-size="18" fill="#183D55">C</text>
<text x="440" y="100" font-family="sans-serif" font-size="18" fill="#183D55">patches[0]: valid triangle</text>
<text x="440" y="140" font-family="sans-serif" font-size="18" fill="#183D55">patches[1]: EMPTY</text>
<text x="440" y="180" font-family="sans-serif" font-size="18" fill="#B33131">EMPTY patch forbidden</text>
<text x="440" y="290" font-family="sans-serif" font-size="16" fill="#183D55">Oblique XYZ projection</text>
</svg>
