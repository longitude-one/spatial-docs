<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img" aria-labelledby="title description">
<title id="title">A closed tetrahedral envelope</title><desc id="description">A closed tetrahedral envelope. A (0,0,0), B (2,0,0), C (0,2,0), D (0,0,2). Four valid triangular patches. Two uses per edge. Valid closed envelope with volume.</desc>
<rect width="820" height="360" fill="#F5F8FA"/>
<!-- Oblique projection: svgX = 140 + 55*x - 35*y; svgY = 190 + 25*y - 60*z. -->
<path d="M 140,190 L 70,240 L 250,190 L 140,190 Z" fill="#39A576" fill-opacity="0.2" stroke="#2784C2" stroke-width="3"/>
<path d="M 140,190 L 250,190 L 140,70 L 140,190 Z" fill="#2784C2" fill-opacity="0.2" stroke="#2784C2" stroke-width="3"/>
<path d="M 140,190 H 250" stroke="#B26A2D" stroke-width="5"/>
<path d="M 140,190 L 140,70 L 70,240 L 140,190 Z" fill="#2784C2" fill-opacity="0.2" stroke="#2784C2" stroke-width="3"/>
<path d="M 250,190 L 70,240 L 140,70 L 250,190 Z" fill="#39A576" fill-opacity="0.3" stroke="#2784C2" stroke-width="3"/>
<path d="M 140,190 L 250,190 M 140,190 L 70,240 M 140,190 L 140,70" stroke="#183D55" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
<circle cx="140" cy="190" r="5" fill="#2784C2" stroke="#183D55" stroke-width="1.5"/><text x="128" y="213" font-family="sans-serif" font-size="18" fill="#183D55">A</text>
<circle cx="250" cy="190" r="5" fill="#2784C2" stroke="#183D55" stroke-width="1.5"/><text x="238" y="213" font-family="sans-serif" font-size="18" fill="#183D55">B</text>
<circle cx="70" cy="240" r="5" fill="#2784C2" stroke="#183D55" stroke-width="1.5"/><text x="58" y="263" font-family="sans-serif" font-size="18" fill="#183D55">C</text>
<circle cx="140" cy="70" r="5" fill="#2784C2" stroke="#183D55" stroke-width="1.5"/><text x="128" y="93" font-family="sans-serif" font-size="18" fill="#183D55">D</text>
<text x="440" y="100" font-family="sans-serif" font-size="18" fill="#183D55">Four valid triangular patches</text>
<text x="440" y="140" font-family="sans-serif" font-size="18" fill="#183D55">Two uses per edge</text>
<text x="440" y="180" font-family="sans-serif" font-size="18" fill="#183D55">Valid closed envelope with volume</text>
<text x="440" y="290" font-family="sans-serif" font-size="16" fill="#183D55">Oblique XYZ projection</text>
</svg>
