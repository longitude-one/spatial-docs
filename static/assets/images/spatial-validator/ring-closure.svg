<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="title description">
<title id="title">Open boundary: closure fails</title><desc id="description">A (0, 0), B (2, 0), C (1, 2) form an open line. The dashed segment from C to A is absent.</desc>
<rect width="640" height="260" fill="#F5F8FA"/>
<path d="M 60,210 L 220,210 L 140,50" fill="none" stroke="#2784C2" stroke-width="4" stroke-linejoin="round"/>
<path d="M 140,50 L 60,210" stroke="#B33131" stroke-width="3" stroke-dasharray="7 6" fill="none"/>
<circle cx="60" cy="210" r="7" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="60" y="240" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">A</text>
<circle cx="220" cy="210" r="7" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="220" y="240" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">B</text>
<circle cx="140" cy="50" r="7" fill="#2784C2" stroke="#183D55" stroke-width="2"/><text x="140" y="80" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#183D55">C</text>
<text x="290" y="90" font-family="sans-serif" font-size="18" fill="#183D55">A → B → C</text>
<text x="290" y="130" font-family="sans-serif" font-size="18" fill="#183D55">Missing closing segment C → A</text>
<text x="290" y="170" font-family="sans-serif" font-size="18" fill="#B33131">Closure: fails</text>
</svg>
