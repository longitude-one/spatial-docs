<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img" aria-labelledby="title description">
<title id="title">Four distinct vertices</title><desc id="description">Four distinct vertices. Coordinates: [[(0, 0), (4, 0), (4, 4), (0, 4), (0, 0)]]. A → B → C → D → A. Five exterior positions. Invalid Triangle position count.</desc>
<rect width="820" height="360" fill="#F5F8FA"/>
<!-- Uniform scale: svgX = 70 + 35*x; svgY = 285 - 35*y. -->
<path d="M 70,285 L 210,285 L 210,145 L 70,145 L 70,285 Z" fill="#D45151" fill-opacity="0.2" stroke="#B33131" stroke-width="3"/>
<circle cx="70" cy="285" r="5" fill="#2784C2" stroke="#183D55" stroke-width="1.5"/><text x="58" y="308" font-family="sans-serif" font-size="18" fill="#183D55">A</text>
<circle cx="210" cy="285" r="5" fill="#2784C2" stroke="#183D55" stroke-width="1.5"/><text x="198" y="308" font-family="sans-serif" font-size="18" fill="#183D55">B</text>
<circle cx="210" cy="145" r="5" fill="#2784C2" stroke="#183D55" stroke-width="1.5"/><text x="198" y="168" font-family="sans-serif" font-size="18" fill="#183D55">C</text>
<circle cx="70" cy="145" r="5" fill="#2784C2" stroke="#183D55" stroke-width="1.5"/><text x="58" y="168" font-family="sans-serif" font-size="18" fill="#183D55">D</text>
<text x="440" y="100" font-family="sans-serif" font-size="18" fill="#183D55">A → B → C → D → A</text>
<text x="440" y="140" font-family="sans-serif" font-size="18" fill="#183D55">Five exterior positions</text>
<text x="440" y="180" font-family="sans-serif" font-size="18" fill="#B33131">Invalid Triangle position count</text>
</svg>
