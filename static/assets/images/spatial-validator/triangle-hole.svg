<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img" aria-labelledby="title description">
<title id="title">A Triangle cannot have holes</title><desc id="description">A Triangle cannot have holes. Coordinates: [[(0, 0), (6, 0), (0, 6), (0, 0)], [(1, 1), (1, 2), (2, 1), (1, 1)]]. rings[0]: triangular exterior. rings[1]: interior hole. Interior ring forbidden.</desc>
<rect width="820" height="360" fill="#F5F8FA"/>
<!-- Uniform scale: svgX = 70 + 35*x; svgY = 285 - 35*y. -->
<path d="M 70,285 L 280,285 L 70,75 L 70,285 Z" fill="#39A576" fill-opacity="0.2" stroke="#2784C2" stroke-width="3"/>
<path d="M 105,250 L 105,215 L 140,250 L 105,250 Z" fill="#F5F8FA" fill-opacity="1" stroke="#B33131" stroke-width="3"/>
<circle cx="70" cy="285" r="5" fill="#2784C2" stroke="#183D55" stroke-width="1.5"/><text x="58" y="308" font-family="sans-serif" font-size="18" fill="#183D55">A</text>
<circle cx="280" cy="285" r="5" fill="#2784C2" stroke="#183D55" stroke-width="1.5"/><text x="268" y="308" font-family="sans-serif" font-size="18" fill="#183D55">B</text>
<circle cx="70" cy="75" r="5" fill="#2784C2" stroke="#183D55" stroke-width="1.5"/><text x="58" y="98" font-family="sans-serif" font-size="18" fill="#183D55">C</text>
<text x="440" y="100" font-family="sans-serif" font-size="18" fill="#183D55">rings[0]: triangular exterior</text>
<text x="440" y="140" font-family="sans-serif" font-size="18" fill="#183D55">rings[1]: interior hole</text>
<text x="440" y="180" font-family="sans-serif" font-size="18" fill="#B33131">Interior ring forbidden</text>
</svg>
