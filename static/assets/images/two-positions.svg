<svg xmlns="http://www.w3.org/2000/svg" width="320" height="140" viewBox="0 0 320 140" role="img" aria-labelledby="title desc">
  <title id="title">Two sample positions</title>
  <desc id="desc">Positions A and B on a rectangular illustration, without a coordinate reference system.</desc>
  <rect x="1" y="1" width="318" height="138" rx="12" fill="#f3f6fa" stroke="#42556b"/>
  <circle cx="80" cy="85" r="8" fill="#165ca2"/>
  <circle cx="235" cy="50" r="8" fill="#165ca2"/>
  <g font-family="sans-serif" font-size="18" fill="#182b40">
    <text x="65" y="115">A</text>
    <text x="225" y="30">B</text>
  </g>
</svg>
